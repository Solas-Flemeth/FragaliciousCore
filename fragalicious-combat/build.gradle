plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.21.5-R0.1-SNAPSHOT")
    implementation project(":fragalicious-core")
    testImplementation 'org.mockbukkit.mockbukkit:mockbukkit-v1.21:4.49.0'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'com.palmergames.bukkit.towny:towny:0.101.1.0'
}

tasks {
    runServer {
        minecraftVersion("1.21")
    }
}
test {
    useJUnitPlatform()
}
java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(21))
}
tasks.register('generateConfigGetters', JavaExec) {
    group = 'utility'
    description = 'Generates getters for FragaliciousConfig fields'
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('org.brassbrewery.fragaliciousCombat.configs.GenerateFragaliciousGetters')
}